<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Galería de héroes</title>
<!-- Galería de modelos: todos los héroes en fila junto a su token, para comparar.
     Abrir con el servidor del juego: http://localhost:8770/tools/galeria.html
     ?ids=hermes,umi limita la lista; ?red=1 muestra la versión de la Legión. -->
<style>
  body { margin: 0; background: #1a1626; color: #eee; font: 13px sans-serif; }
  canvas { display: block; }
  #toks { position: absolute; left: 0; right: 0; top: 0; display: flex; }
  #toks div { flex: 1; text-align: center; padding-top: 6px; }
  #toks img { width: 64px; height: 64px; border-radius: 50%; }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="toks"></div>
<script type="module">
import * as THREE from 'three';
import { HEROES, HERO_ORDER } from '../js/config.js';
import '../js/roster.js';
import { buildHeroModel } from '../js/models.js';

const q = new URLSearchParams(location.search);
const ids = q.get('ids') ? q.get('ids').split(',') : HERO_ORDER;
const perRow = Math.min(ids.length, Number(q.get('row')) || 9);
const rows = Math.ceil(ids.length / perRow);
const spanX = perRow * 1.4, spanY = rows * 1.45 + 0.2;
const W = innerWidth, Hh = Math.round(W * spanY / spanX) + 90;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, Hh); renderer.setPixelRatio(devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2438);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 8); scene.add(sun);
const top = spanY * (Hh / (Hh - 90));
const cam = new THREE.OrthographicCamera(-spanX / 2, spanX / 2, top - 0.15, -0.15, 0.1, 100);
cam.position.set(0, 0, 10); scene.add(cam);
ids.forEach((id, i) => {
  const mdl = buildHeroModel(id, q.get('red') === '1');
  const x = (i % perRow - (perRow - 1) / 2) * 1.4, y = (rows - 1 - Math.floor(i / perRow)) * 2.9 * 0.5;
  mdl.group.position.set(x, y, 0);
  mdl.group.scale.setScalar(0.55);
  mdl.group.rotation.y = Number(q.get('rot')) || 0.35;
  scene.add(mdl.group);
});
const toks = document.getElementById('toks');
if (rows === 1) toks.innerHTML = ids.map((id) => `<div><img src="../tokens/${id}.webp" alt=""><br>${HEROES[id]?.name || id}</div>`).join('');
renderer.setAnimationLoop(() => renderer.render(scene, cam));
window.__galeria = 'ok';
</script>
</body>
</html>
